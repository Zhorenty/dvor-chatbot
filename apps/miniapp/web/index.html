<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="DVOR — тренировки, походы и трейлы.">
  <meta name="theme-color" content="#0D0E0B">
  <title>DVOR</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #0D0E0B; overscroll-behavior: none; }
    @media (prefers-color-scheme: light) { html, body { background: #F3F3EC; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      transition: opacity .35s ease;
    }
    #splash img { width: 132px; animation: pulse 1.4s ease-in-out infinite; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(173,184,56,.18); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #ADB838; border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .55; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    #splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash"><img src="splash-logo.png" alt="DVOR"><div class="bar"></div></div>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.colorScheme === 'light') { document.body.style.background = '#F3F3EC'; }
      if (tg) { try { tg.expand(); } catch (e) {} }
      window.addEventListener('flutter-first-frame', function () {
        var s = document.getElementById('splash');
        s.classList.add('hide');
        setTimeout(function () { s.remove(); }, 400);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
